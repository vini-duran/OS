name: Monitorar atualizações do upstream

on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Buscar upstream oficial
        run: |
          git remote add upstream https://github.com/andremjr/contentflow-os.git
          git fetch upstream main --tags --prune
          echo "UPSTREAM_SHA=$(git rev-parse upstream/main)" >> "$GITHUB_ENV"
          echo "UPSTREAM_SUBJECT=$(git log -1 --format=%s upstream/main)" >> "$GITHUB_ENV"
          echo "AHEAD_BEHIND=$(git rev-list --left-right --count HEAD...upstream/main | tr '\t' '/')" >> "$GITHUB_ENV"

      - name: Abrir ou atualizar aviso de integração
        uses: actions/github-script@v7
        env:
          UPSTREAM_SHA: ${{ env.UPSTREAM_SHA }}
          UPSTREAM_SUBJECT: ${{ env.UPSTREAM_SUBJECT }}
          AHEAD_BEHIND: ${{ env.AHEAD_BEHIND }}
        with:
          script: |
            const title = "[upstream] atualização pendente do ContentFlow OS";
            const body = [
              "O monitor detectou o estado atual do upstream oficial.",
              "",
              `- Commit upstream: \`${process.env.UPSTREAM_SHA}\``,
              `- Assunto: ${process.env.UPSTREAM_SUBJECT}`,
              `- Divergência fork/upstream (ahead/behind): ${process.env.AHEAD_BEHIND}`,
              "",
              "Não houve merge, build ou instalação automática.",
              "Para integrar: crie uma branch de atualização, revise o diff, teste e só então promova ao main.",
            ].join("\n");
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const existing = issues.find((issue) => issue.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }
